name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build · test · publish
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 55
    steps:
      - name: Install toolchain
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel rust git pkgconf pacman nodejs
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Verify
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked --test aur_nan --test tui_snapshot
          pacman -Sy --noconfirm
          cargo test --locked --test integration_search

      - name: Build release binary
        id: build
        run: |
          # -p pakmap (v0.9.2): the bare `cargo build --release` used to compile
          # the whole workspace — including pakmap-gui WITHOUT the custom-protocol
          # feature, which is then rebuilt entirely in the GUI step. Building
          # only the CLI here drops that wasted full GUI compile.
          cargo build --release --locked -p pakmap
          VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          STAGE="${RUNNER_TEMP}/pakmap-dist"
          mkdir -p "$STAGE"
          cp target/release/pakmap "$STAGE/pakmap"
          strip "$STAGE/pakmap" || true
          LICENSE=LICENSE
          test -f LICENSE || LICENSE=README.md
          cp "$LICENSE" "$STAGE/"
          cp README.md "$STAGE/"
          tar -C "$STAGE" -czf "${RUNNER_TEMP}/pakmap-${VERSION}-x86_64-linux.tar.gz" .
          ls -lh target/release/pakmap "${RUNNER_TEMP}/pakmap-${VERSION}-x86_64-linux.tar.gz"
          echo "artifact=${RUNNER_TEMP}/pakmap-${VERSION}-x86_64-linux.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: pakmap-${{ steps.build.outputs.version }}-x86_64-linux
          path: ${{ steps.build.outputs.artifact }}
          if-no-files-found: error

      - name: GUI toolchain (webkit for cargo link)
        run: pacman -S --noconfirm --needed webkit2gtk-4.1

      # Self-contained JS toolchain (v0.9.2 hotfix 2): pacman's upgraded node26
      # and pnpm's standalone launcher both die in this container with
      # "libsimdjson.so.34: cannot open shared object file". setup-node ships a
      # fully self-contained node22 tarball; pnpm then installs as pure JS via
      # its npm — no launcher ELF, no host ABI surface at all.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm (pure JS via npm)
        run: |
          PKG_MGR="$(node -e "process.stdout.write(require('./gui/package.json').packageManager || 'pnpm@10')")"
          npm install -g "$PKG_MGR"
          pnpm --version

      - name: Build GUI release binary
        id: guibuild
        run: |
          set -e
          pnpm --dir gui install --frozen-lockfile
          pnpm --dir gui build
          # tauri/custom-protocol is what makes generate_context! embed dist/
          # — without it the binary is a dev-mode build that loads devUrl
          # (a "Connection refused" webview).
          cargo build --release --locked -p pakmap-gui --features tauri/custom-protocol
          # NFR size gate (v0.9.2): the ≤10M ceiling on the GUI binary is
          # release-blocking, not a docs footnote. A dependency bump that
          # quietly breaches it must fail the release at the gate — after
          # publishing there is no gate left. Enforced limit is the strict
          # decimal reading (10,000,000 bytes; v0.9.1 shipped 9,947,480).
          SIZE="$(stat -c%s target/release/pakmap-gui)"
          LIMIT=10000000
          echo "GUI binary size gate: $SIZE / $LIMIT bytes"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::pakmap-gui is $SIZE bytes — above the 10M NFR ceiling ($LIMIT). Shrink dependencies (or explicitly re-baseline the NFR in docs/gui-architecture.md + AGENTS.md first), then re-tag."
            exit 1
          fi
          # Boot smoke under xvfb: the app must quit 0, which now also proves
          # the frontend really issued IPC inside the webview (exit 3 = the
          # "connection refused" error-page failure mode). libayatana-appindicator
          # keeps the tray backend loadable here (the AUR pkgbuild declares it): a
          # lib-less container already proves the graceful tray-less path in ci.yml.
          pacman -S --noconfirm --needed xorg-server-xvfb dbus ttf-dejavu libayatana-appindicator
          # FP budget (v0.9.2): exit 4 if the shell's first IPC lands later
          # than 3s since process start (measured ~1.1s locally; devUrl-style
          # breakage still exits 3 first — no IPC at all).
          xvfb-run -a dbus-run-session -- env PAKMAP_GUI_SMOKE_MS=10000 PAKMAP_GUI_FPBUDGET_MS=3000 ./target/release/pakmap-gui
          VERSION="${{ steps.build.outputs.version }}"
          STAGE="${RUNNER_TEMP}/pakmap-gui-usr"
          mkdir -p "$STAGE/usr/bin" \
                   "$STAGE/usr/share/applications" \
                   "$STAGE/usr/share/icons/hicolor/32x32/apps" \
                   "$STAGE/usr/share/icons/hicolor/128x128/apps" \
                   "$STAGE/usr/share/icons/hicolor/256x256/apps" \
                   "$STAGE/usr/share/licenses/pakmap-gui"
          install -m755 target/release/pakmap-gui "$STAGE/usr/bin/pakmap-gui"
          install -m644 gui/desktop/pakmap-gui.desktop "$STAGE/usr/share/applications/"
          install -m644 gui/src-tauri/icons/32x32.png      "$STAGE/usr/share/icons/hicolor/32x32/apps/pakmap-gui.png"
          install -m644 gui/src-tauri/icons/128x128.png    "$STAGE/usr/share/icons/hicolor/128x128/apps/pakmap-gui.png"
          install -m644 gui/src-tauri/icons/128x128@2x.png "$STAGE/usr/share/icons/hicolor/256x256/apps/pakmap-gui.png"
          install -m644 LICENSE "$STAGE/usr/share/licenses/pakmap-gui/LICENSE"
          TARBALL="${RUNNER_TEMP}/pakmap-gui-${VERSION}-x86_64-linux.tar.gz"
          tar -C "$STAGE" -czf "$TARBALL" usr
          ls -lh "$TARBALL"
          echo "artifact=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload GUI artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: pakmap-gui-${{ steps.build.outputs.version }}-x86_64-linux
          path: ${{ steps.guibuild.outputs.artifact }}
          if-no-files-found: error

      - name: SHASUMS256.txt (install.sh verifies downloads against this)
        run: |
          cd "${RUNNER_TEMP}"
          sha256sum pakmap-*.tar.gz > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: pakmap ${{ steps.build.outputs.version }}
          files: |
            ${{ steps.build.outputs.artifact }}
            ${{ steps.guibuild.outputs.artifact }}
            ${{ runner.temp }}/SHASUMS256.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
