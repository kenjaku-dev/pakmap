# AB workspace: root package `pakmap` (CLI/TUI) + `gui/src-tauri` (Tauri 2.12 GUI).
# default-members keeps bare cargo commands (CI rust job, Makefile, install.sh)
# operating on the CLI crate exactly as before — GUI gates use explicit -p/--workspace.
[workspace]
members = ["gui/src-tauri"]
default-members = ["."]

[workspace.package]
# Tauri 2.12 policy is stable-3 (MSRV 1.90); local toolchain far ahead.
rust-version = "1.90"

[package]
name = "pakmap"
version = "0.9.3"
edition = "2024"
description = "Fast package search for Arch/Artix official repos and AUR — written in Rust"
authors = ["achraf"]
license = "MIT"
repository = "https://github.com/kenjaku-dev/pakmap"
keywords = ["aur", "pacman", "alpm", "arch", "search"]
categories = ["command-line-utilities"]
readme = "README.md"
rust-version = { workspace = true }

# Perf P5: production code must never panic on bad input — deny unwrap/expect
# everywhere, then re-allow inside #[cfg(test)] modules (one cfg_attr in
# lib.rs covers all lib unit tests; integration files allow at file top).
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
clap = { version = "4.5", features = ["derive", "color", "wrap_help"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "blocking", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
alpm = "5"
pacmanconf = "3"
colored = "3"
indicatif = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
url = "2"
# TUI stack — ratatui skill (0.30.1) + tui-design ecosystem-rust
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
color-eyre = "0.6"
tui-input = "0.15"
dirs = "7"
nix = { version = "0.31", features = ["user"] }
unicode-width = "0.2"
signal-hook = "0.4"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# panic = "abort" disabled for TUI stability — color_eyre hook needs unwind to restore terminal (tui-design lifecycle)
# keep unwind so raw/altscreen restored on panic; use `cargo build --release` still stripped and small
panic = "unwind"

[profile.dev]
opt-level = 0
# AI build-speed: slim debuginfo (line-tables only) — faster link + less disk on
# every rebuild; full symbols via `debug = true` override when needed. UI-safe:
# rustc-feature only, no external tool required (CI unaffected).
debug = "line-tables-only"
split-debuginfo = "unpacked"
