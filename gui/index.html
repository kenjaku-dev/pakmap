<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pakmap</title>
    <script>
      // Theme bootstrap: resolve BEFORE first paint so there is no flash of
      // the default dark scheme on light-system setups. Mirrors useTheme:
      // stored "system" (or nothing) follows prefers-color-scheme.
      // D1: a backend-injected override (window.__PAKMAP_THEME_OVERRIDE =
      // "system"|"light"|"dark", from [gui] theme in the config) wins over
      // the stored device preference; absent (null) keeps today's order.
      (function () {
        try {
          var ov = window.__PAKMAP_THEME_OVERRIDE || null;
          var light =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches;
          var t = ov === "light" || ov === "dark" ? ov
            : ov === "system" ? (light ? "light" : "dark")
            : (localStorage.getItem("pakmap-theme") === "light" ||
               localStorage.getItem("pakmap-theme") === "dark")
              ? localStorage.getItem("pakmap-theme")
              : (light ? "light" : "dark");
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
