<!doctype html>
<html lang="en" data-theme="dark">
  <!--
    v0.9.1 §4 splash (cold-start feedback): shown instantly while the main
    webview warms up (webkit init ~1.1s). Purely static — no scripts at all
    (CSP-safe by construction); the Rust side closes it when the frontend
    issues its first IPC (main_window_ready), with a Rust-side fallback timer
    that reveals the main window even if this page is all that loads.
  -->
  <head>
    <meta charset="UTF-8" />
    <title>pakmap — starting…</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #080d17;
        color: #f1f5f9;
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .mark {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .mark span {
        color: #22c55e;
      }
      .spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2.5px solid #2a3a55;
        border-top-color: #22c55e;
        animation: spin 0.9s linear infinite;
      }
      .hint {
        font-size: 11px;
        color: #94a3b8;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">pak<span>map</span></div>
      <div class="spinner" role="status" aria-label="loading"></div>
      <div class="hint">starting up…</div>
    </main>
  </body>
</html>
