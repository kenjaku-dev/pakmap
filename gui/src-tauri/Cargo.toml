[package]
name = "pakmap-gui"
version = "0.8.0"
edition = "2024"
description = "pakmap desktop GUI (Tauri 2) — search/install/remove Arch repo, AUR and Flatpak packages"
authors = ["achraf"]
license = "MIT"
rust-version = { workspace = true }

# Same P5 discipline as the core crate: no unwrap/expect outside tests.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
pakmap = { path = "../.." }
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-opener = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
